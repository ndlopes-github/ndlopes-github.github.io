[[pub]]
id = "p-cose-2026"
section = "journal"
topics = ["coastal"]
badge = "COSE"
year = 2026
authors = ["R. Lemos", "A. Mendonça", "C. J. E. M. Fortes", "C. Martinez", "H. Girão", "T. Lopes", "L. Brito", "N. D. Lopes", "A. Prior"]
title = "Damage evolution formulation: a new approach"
display = "<em>Coastal and Offshore Science and Engineering</em> 5, 36–47"
bibtype = "article"
journal = "Coastal and Offshore Science and Engineering"
number = "5"
pages = "36–47"
doi = "10.53256/COSE_240103"
# abstract: published PDF (ecampusuniversitypress.it), page 1
abstract = '''One of the most influential contributions to damage progression formulations was introduced by Melby and Kobayashi. Their initial model was published in Melby and Kobayashi (1988a, b) and subsequently reformulated in Melby and Kobayashi (1999) to allow for non-zero initial damage values. A comprehensive description of these developments is provided in Melby (1999). The formulation predicts damage evolution in rubble mound breakwaters (RMBs) with rock-armoured layers, based on erosion measured in physical scale-model tests and on the characteristics of the incident wave conditions. However, the applicability of this formulation is limited to rock armour layers and to the range of sea states investigated in the original experiments. The present work revisits the Melby and Kobayashi damage evolution formulation and investigates its extension to rubble mound breakwaters armoured with tetrapods. A first approach was previously undertaken using a two-dimensional scale model of a section of the Ericeira breakwater (Lemos et al., 2023), leading to the calibration of new coefficients for the Melby formulation (<em>a</em><sub>p</sub> = 0.03 and <em>b</em> = 0.16). The objective of the present study is to further adjust these coefficients for comparable sea states while accounting for three-dimensional effects on damage evolution, including frontal wave attack. To this end, a long-duration test series (Series A) and two additional series with limited test durations (Series B and C) were conducted using a 1:65 three-dimensional physical model of the Ericeira harbour breakwater. The eroded volume of a selected section of the armour layer was measured using a Kinect position sensor. The damage parameter values obtained from the three-dimensional experiments are higher than those predicted by the formulation derived from the two-dimensional tests (Lemos et al., 2023). Based on the three-dimensional experimental results, new values of the coefficients <em>a</em><sub>p</sub> and <em>b</em> for the Melby and Kobayashi formulation were determined by minimising the root mean square error between measured and predicted damage. The predictive relationships proposed by Melby and Kobayashi (1988a, b), calibrated with <em>a</em><sub>p</sub> = 0.025 and <em>b</em> = 0.30 for the present test programme and accounting for three-dimensional effects associated with bathymetry, are shown to provide a reasonable description of damage evolution, with deviations remaining within an acceptable standard deviation.'''

[[pub]]
id = "p-4or-2025"
section = "journal"
topics = ["industry"]
badge = "4OR"
year = 2025
authors = ["A. Araújo", "J. O. Cerdeira", "N. D. Lopes", "A. Moura"]
title = "Minimizing costs in signal provision by communication antennas along a railway line"
display = "<em>4OR – A Quarterly Journal of Operations Research</em> 23(4), 435–454"
bibtype = "article"
journal = "4OR – A Quarterly Journal of Operations Research"
volume = "23"
number = "4"
pages = "435–454"
doi = "10.1007/s10288-025-00599-7"
links = [{ label = "Code", url = "https://github.com/ndlopes-github/RailwayOptSitePos" }]
# abstract: Crossref
abstract = '''In this paper we address a wireless network design problem on a railway line. Given a finite set of locations along a railway line and different types of communication antennas that can be installed at each of these locations, which locations and which type of antenna should be selected to ensure a certain level of signal coverage along the railway line while minimizing construction costs? We formulate the problem as a 0/1 linear optimization model, prove that the problem is NP-hard, and report computational experiments using real and simulated data. The computational tests showed that the model is capable of solving the problem for railway lines longer than any existing real railway lines.'''

[[pub]]
id = "p-ijnam-2024"
section = "journal"
topics = ["flows"]
badge = "IJNAM"
year = 2024
authors = ["H. B. de Oliveira", "N. D. Lopes"]
title = "Continuous/discontinuous finite element approximation of a 2D Navier–Stokes problem arising in fluid confinement"
display = "<em>International Journal of Numerical Analysis and Modeling</em> 21(3), 315–352"
bibtype = "article"
journal = "International Journal of Numerical Analysis and Modeling"
volume = "21"
number = "3"
pages = "315–352"
doi = "10.4208/ijnam2024-1013"
# abstract: Crossref
abstract = '''In this work, a stationary 2d Navier–Stokes problem with nonlinear feedback forces field is considered in the stream-function formulation. We use the Continuous/Discontinuous Finite Element Method (CD-FEM), with interior penalty terms, to numerically solve the associated boundary-value problem. For the associated continuous and discrete problems, we prove the existence of weak solutions and establish the conditions for their uniqueness. Consistency, stability and convergence of the method are also shown analytically. To validate the numerical model regarding its applicability and robustness, several test cases are carried out.'''

[[pub]]
id = "p-jmi-2023"
section = "journal"
topics = ["industry"]
badge = "JMI"
year = 2023
authors = ["R. Enguiça", "N. D. Lopes"]
title = "The modelling of urban running races"
display = "<em>Journal of Mathematics in Industry</em> 13"
bibtype = "article"
journal = "Journal of Mathematics in Industry"
volume = "13"
doi = "10.1186/s13362-023-00136-3"
links = [{ label = "Code", url = "https://github.com/ndlopes-github/BoostRace" }]
# abstract: Crossref
abstract = '''In this paper, we model mass running urban races, taking into consideration several conditioning factors. The main goal is to find ideal configurations of the start of the race, splitting it into several waves, reducing the density of athletes and the overall time lost, when comparing the normal race results with a race without density constraints. This model takes into account distinct realistic runners’ profiles, changes in slope and width on the race course and its influence on the running pace. Moreover, density levels, dynamics of the start of the race and time between the departure of waves are also considered.'''

[[pub]]
id = "p-camwa-2021"
section = "journal"
topics = ["flows"]
badge = "CAMWA"
year = 2021
authors = ["N. D. Lopes", "H. B. de Oliveira"]
title = "Continuous/discontinuous Galerkin approximations for a fourth-order nonlinear problem"
display = "<em>Computers &amp; Mathematics with Applications</em> 97, 122–152"
bibtype = "article"
journal = "Computers & Mathematics with Applications"
volume = "97"
pages = "122–152"
doi = "10.1016/j.camwa.2021.05.034"
# abstract: authors' final LaTeX source (not deposited at Crossref)
abstract = '''We introduce a Continuous/Discontinuous Galerkin Finite Element Method (CDFEM) with interior penalty terms to solve a nonlinear fourth-order problem that appears in the analysis of the confinement of fluid flows governed by the Stokes system. For the associated continuous and discrete problems, we prove the existence and uniqueness of weak solutions. Consistency, stability and convergence of the method are shown analytically. To show the applicability and robustness of the numerical model, several test cases are performed.'''

