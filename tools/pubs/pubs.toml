# <!-- pubs:begin --> / <!-- pubs:end --> (Publications) and <!-- review:begin --> / <!-- review:end -->
# (Work in progress) in index.html, including the BibTeX entries.
#
# Fields
#   id        stable HTML id (p- journal, c- chapter, b- book, k- proceedings, r- report, t- thesis, s- under review)
#   section   journal | book | proceedings | report | thesis | review   (order within a section = order here)
#   topics    any of: waves, coastal, flows, industry, other   (first one colours the badge; used by the filters)
#   badge     short venue label shown in the badge
#   authors   "Initials Surname"; the self-name is always "N. D. Lopes"
#   display   the venue line exactly as shown on the page (HTML allowed)
#   bibtype + bib fields (journal, volume, number, pages, booktitle, editor, series, publisher, address,
#             edition, institution, type, school, note, url, doi) feed the generated BibTeX
#   abstract  optional HTML; source noted in a comment
#   links     optional list of { label, url }

