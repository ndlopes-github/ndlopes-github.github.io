[[pub]]
id = "p-ijnmf-2012"
section = "journal"
topics = ["waves"]
badge = "IJNMF"
year = 2012
authors = ["N. D. Lopes", "P. J. S. Pereira", "L. Trabucho"]
title = "A numerical analysis of a class of generalized Boussinesq-type equations using continuous/discontinuous FEM"
display = "<em>International Journal for Numerical Methods in Fluids</em> 69(7), 1186–1218"
bibtype = "article"
journal = "International Journal for Numerical Methods in Fluids"
volume = "69"
number = "7"
pages = "1186–1218"
doi = "10.1002/fld.2631"
# abstract: Crossref (publisher's copyright line removed)
abstract = '''An improved class of Boussinesq systems of an arbitrary order using a wave surface elevation and velocity potential formulation is derived. Dissipative effects and wave generation due to a time-dependent varying seabed are included. Thus, high-order source functions are considered. For the reduction of the system order and maintenance of some dispersive characteristics of the higher-order models, an extra <em>O</em>(<em>μ</em><sup>2<em>n</em>+2</sup>) term (<em>n</em> ∈ ℕ) is included in the velocity potential expansion. We introduce a nonlocal continuous/discontinuous Galerkin FEM with inner penalty terms to calculate the numerical solutions of the improved fourth-order models. The discretization of the spatial variables is made using continuous <em>P</em><sub>2</sub> Lagrange elements. A predictor-corrector scheme with an initialization given by an explicit Runge–Kutta method is also used for the time-variable integration. Moreover, a CFL-type condition is deduced for the linear problem with a constant bathymetry. To demonstrate the applicability of the model, we considered several test cases. Improved stability is achieved.'''

