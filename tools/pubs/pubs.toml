[[pub]]
id = "r-wine-2026"
section = "report"
topics = ["industry"]
badge = "MIIR"
year = 2026
authors = ["A. Costa", "A. Gavina", "A. Mota", "A. Moura", "C. Dias", "L. Afonso", "N. D. Lopes"]
title = "Enhancing wine sensory evaluation: develop a robust system for consistent and accurate taster scores"
display = "<em>Mathematics in Industry Reports</em>. ESGI&nbsp;181, problem from the Vinho Verde Viticulture Commission"
bibtype = "techreport"
institution = "Mathematics in Industry Reports"
note = "ESGI 181, problem from the Vinho Verde Viticulture Commission"
doi = "10.33774/miir-2026-vt4px"
# abstract: Crossref
abstract = '''This report addresses a challenge proposed by Comissão de Viticultura da Região dos Vinhos Verdes (CVRVV) at the 181st European Study Group in Industry. Here we investigate the refinement of the sensory evaluation methodology of wine employed by the CVRVV laboratory, with a focus on improving statistical rigor and tasters' assessments. We perform a detailed statistical analysis of the sensory evaluation data, including measures of central tendency, dispersion, and distribution, to identify sources of variability. We also develop a script to assess tasters consistency by analyzing deviations from the panel median and repeatability across tests. These approaches improve the aggregation of sensory data, detect errors, and establish sound statistical criteria for sample validation and test series acceptance, ensuring more precise and reliable sensory analysis.'''

[[pub]]
id = "r-soles-2024"
section = "report"
topics = ["industry"]
badge = "MIIR"
year = 2024
authors = ["A. Moura", "I. C. Lopes", "J. Matias", "N. D. Lopes", "R. Enguiça"]
title = "Optimization of sole production scheduling"
display = "<em>Mathematics in Industry Reports</em>. ESGI&nbsp;174, problem from SoftIdea"
bibtype = "techreport"
institution = "Mathematics in Industry Reports"
note = "ESGI 174, problem from SoftIdea"
doi = "10.33774/miir-2024-zhmg5"
# abstract: Crossref
abstract = '''This report addresses a challenge proposed at the 174th European Study Group in Industry to develop an algorithm to optimize processes on rubber soles manufacturing. The objective is to create an order distribution plan that maximizes efficiency, reduces setup times synchronizing molds changing, ensuring that delivery dates are met. This problem can be classified as a parallel machines scheduling problem with sequence dependent setup times. This work presents an heuristic that minimizes the makespan, accounting for the sequence dependent setup times, divided into two steps: (i) a client’s order will be partitioned into sets corresponding to the assigned slots; (ii) reorder the molds within each position of the press, so that setup times are simultaneous. We find solutions for real data, for cases with double and triple molds for a given size. Results show that synchronization of setup times due to heating and mold changes decrease significantly the makespan.'''

