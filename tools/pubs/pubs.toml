year = 2023
authors = ["L. V. Pinheiro", "A. H. Gomes", "N. D. Lopes", "S. Lopes", "A. Prior", "J. A. Santos", "C. J. Fortes"]
title = "Neural networks for optimization of an early warning system for moored ships in harbours"
display = "<em>Coastal Engineering Proceedings</em> 37 (ICCE 2022), paper 60"
bibtype = "inproceedings"
booktitle = "Coastal Engineering Proceedings (ICCE 2022)"
volume = "37"
pages = "60"
doi = "10.9753/icce.v37.papers.60"
# abstract: Crossref ("80percent" spaced as "80 percent")
abstract = '''Within the BlueSafePort project, an early warning system (EWS) for moored ships in the port of Sines was developed. In order to improve the reliability and accuracy of the system, two neural networks (NN) were trained, using wave buoys measured datasets. Numerical models results for the wave propagation are adjusted and forecasts are improved. The trained neural networks were able to produce more accurate estimates for the significant wave height and mean wave period, at the buoy location, deployed in front of the Sines Port. The use of the new NN led to an overall reduction of the root mean square error of around 80 percent compared with SWAN numerical model simulations, thus reducing potential errors in subsequential calculations and alert levels issued by the system for the moored ships.'''

